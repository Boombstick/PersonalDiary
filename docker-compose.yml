version: "3.9"
services:
  api:
    build:
      context: https://github.com/Boombstick/PersonalDiary.git#dev # Укажите ссылку на ваш репозиторий
      dockerfile: Dockerfile # Имя Dockerfile в корне репозитория
    ports:
      - "5000:5000" # Отображение порта API
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      - postgres # API должен дождаться запуска базы данных
    networks:
      - app-network

  postgres:
    image: postgres:15.3 # Последняя версия PostgreSQL
    container_name: postgres-db
    ports:
      - "5432:5432" # Отображение порта PostgreSQL
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pesonalDiary
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
      
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: personal-diary-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com    # Email для входа в pgAdmin
      PGADMIN_DEFAULT_PASSWORD: admin          # Пароль для входа
    ports:
      - "5050:80"                              # pgAdmin доступен на порту 5050
    depends_on:
      - postgres                               # Зависимость от сервиса postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
